<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>
<body>

<table border="1">
    <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
    </tr>

    <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
    </tr>

    <tr>
        <td>7</td>
        <td>8</td>
        <td>9</td>
    </tr>
</table>
 <br> <br>

<table border="1" cellspacing="0" cellpadding="15">
    <tr>
        <td rowspan="3">C</td>
        <td>A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
        <td>E</td>
    </tr>
    <tr>
        <td>G</td>
        <td>F</td>
    </tr>
</table>

 <br> <br>
<table border="1" cellspacing="0" cellpadding="10">
    <tr>
        <td>11</td>
        <td>12</td>
        <td colspan="2">13</td>
        <td rowspan="5">14</td>
    </tr>

    <tr>
        <td colspan="3">17</td>
        <td rowspan="3">15</td>
    </tr>

    <tr>
        <td colspan="3">16</td>
    </tr>

    <tr>
        <td rowspan="2">18</td>
        <td colspan="2">19</td>
    </tr>

    <tr>
        <td>20</td>
        <td>21</td>
        <td></td>
    </tr>
</table>

</body>
</html>
